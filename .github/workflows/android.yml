# Baut die Android-App, testet sie in einem echten Android-Emulator und stellt sie
# als Release „android-latest“ bereit (Download der APK direkt auf dem Handy).
name: Android-App

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "icons/**"
      - "android/**"
      - "pyproject.toml"
      - "scripts/build-apk.sh"
      - "scripts/android-smoke-test.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: write  # Release anlegen

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests (ohne Android)
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg  # nur für Testvideos
          pip install uv
          uv sync
          uv run ruff check
          uv run mypy src
          uv run pytest -q

      - name: APK bauen
        run: |
          pip install briefcase==0.4.6
          bash scripts/build-apk.sh

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Android-Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke-test.sh dist-apk/Terminal-0.1.0.apk

      - name: Testergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: |
            test-output/
            dist-apk/*.apk

      - name: Release „android-latest“ aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist-apk/*.apk \
            test-output/screenshot-hochladen.png test-output/screenshot-konten.png \
            --prerelease --target "$GITHUB_SHA" \
            --title "Terminal für Android (neuester Build)" \
            --notes "Gebaut aus ${GITHUB_SHA::7} und im Android-Emulator getestet. Auf dem Handy: **Terminal-0.1.0.apk** antippen → herunterladen → installieren (Installation aus dieser Quelle einmal erlauben)."
