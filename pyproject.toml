[project]
name = "terminal"
version = "0.1.0"
description = "Hochformat-Videos per Kommandozeile als Instagram Reel, YouTube Short und TikTok-Entwurf hochladen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "keyring>=25.0",
    "rich>=13.7",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.scripts]
terminal = "terminal.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
