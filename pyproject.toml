[project]
name = "terminal"
version = "0.1.0"
description = "Hochformat-Videos per Kommandozeile als Instagram Reel, YouTube Short und TikTok-Entwurf hochladen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    # Android/Termux hat keinen Schlüsselbund – dort liegen Tokens in einer Datei
    "keyring>=25.0; sys_platform != 'android'",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
smvut = "terminal.cli:app"
terminal = "terminal.cli:app"  # alter Name, funktioniert weiter

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    # App-Tests ohne Android: Toga mit dem kopflosen Test-Backend
    "toga-core~=0.5.0",
    "toga-dummy~=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# --- Android-App (BeeWare Briefcase): briefcase build android ---------------
[tool.briefcase]
project_name = "SMVUT"
bundle = "io.github.systemerror5251"
version = "0.1.0"
url = "https://github.com/SystemError5251/SMVUT"
author = "SystemError5251"
# Keine Open-Source-Lizenz gewählt: alle Rechte vorbehalten
license = "LicenseRef-Proprietary"

[tool.briefcase.app.terminal_app]
formal_name = "SMVUT"
description = "Videos als YouTube Short, Instagram Reel und TikTok-Entwurf hochladen"
long_description = """Lädt Hochformat-Videos über die offiziellen APIs hoch.
Gleiche Logik wie die Kommandozeile `terminal` (Paket src/terminal)."""
icon = "icons/terminal"
sources = ["src/terminal", "src/terminal_app"]
# Briefcase übernimmt zusätzlich [project].dependencies (typer/rich: klein, harmlos)
requires = [
    "httpx>=0.27",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[tool.briefcase.app.terminal_app.android]
requires = ["toga-android~=0.5.0"]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
splash_background_color = "#0F172A"
build_gradle_dependencies = ["com.google.android.material:material:1.13.0"]
# Fester Signaturschlüssel aus dem Repo (Standard-Debug-Passwort „android“): Jede neue APK
# lässt sich über die alte installieren, ohne Neuinstallation (sonst wären Logins weg).
# debuggable false: Fremde können per USB/adb nicht in die Login-Daten der App schauen.
build_gradle_extra_content = """
android {
    signingConfigs {
        debug {
            storeFile new File(rootProject.projectDir, "../../../../android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
}
"""
